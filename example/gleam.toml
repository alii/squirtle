name = "example"
version = "1.0.0"

# Standalone project for the runnable example. Depends on squirtle via a local
# path so it exercises the working tree, and is NOT part of the published
# package. Run with: gleam run -m example
[dependencies]
squirtle = { path = ".." }
gleam_stdlib = ">= 0.68.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
